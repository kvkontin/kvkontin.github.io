<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Nomai Language Dictionary</title>
        <link rel="icon" type="image/x-icon" href="../assets/nomai/nomai_icon.ico">
        <meta charset="UTF-8">
        <meta name="description" content="Search the dictionary of the fanmade Nomai language.">
        <meta name="author" content="kvkontin">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>
            :root {
                --background-dark: #37342c;
                --background-light: #f4e1ac;
                --content-dark: #ffffff;
                --content-light: #000000;
                --highlight-orange-dark: #ff8f4e;
                --highlight-orange-light: #a13202;
                --highlight-blue-dark: #879efd;
                --highlight-blue-light: #4c65c9;

                --background: var(--background-dark);
                --content: var(--content-dark);
                --highlight-blue: var(--highlight-blue-dark);
                --highlight-orange: var(--highlight-orange-dark);
            }
            * {
                background-color: var(--background);
                color: var(--content);
                font-family: Verdana, sans-serif;
                font-size: 14px;
                line-height: 1.6;
            }
            #lightDarkButton {
                position: absolute;
                top: 8px;
                right: 14px;
                z-index: 1;
            }
            #headingContainer {
                padding: 14px;
            }
            h1 {
                color: var(--highlight-blue);
                font-size: 28px;
            }
            .lastUpdated {
                color: var(--highlight-orange);
            }
            #controls {
                position: sticky;
                top: 0px;
                left: 0px;
                margin: 0px;
                padding-left: 14px;
                padding-top: 4px;
                padding-bottom: 8px;
            }
            #selections, #searchBar {
                display: inline-block;
            }
            input, button, select {
                border-color: var(--content);
                border-style: solid;
                border-width: 2px;
                border-radius: 6px;
                padding: 4px;
                margin-top: 4px;
                margin-bottom: 4px;
            }
            #results {
                margin: auto;
                max-width: 600px;
                padding-left: 14px;
                padding-right: 14px;
            }
            .dictionaryEntry {
                padding-bottom: 10px;
            }
            .romanisation {
                font-family: 'Courier New', monospace;
                font-size: 20px;
                font-weight: bold;
                color: var(--highlight-blue);
                margin-bottom: 0px;
                padding-bottom: 0px;
            }
            .pronunciation {
                font-size: 14px;
                color: var(--content);
                margin-top: 0px;
                padding-top: 0px;
                margin-bottom: 4px;
                padding-bottom: 0px;
            }
            .partOfSpeech {
                font-size: 12px;
                color: var(--highlight-orange);
                margin-top: 0px;
                padding-top: 0px;
            }
            footer {
                margin-top: 48px;
            }
            footer > * {
                color: var(--content);
                opacity: 0.7;
                font-size: 12px;
            }
            .hidden {
                visibility: hidden;
            }
        </style>
    </head>

    <body>
        <button id="lightDarkButton" onclick="darkModeToggled()">Mode: dark</button>

        <div id="headingContainer">
            <h1>Nomai Language Dictionary</h1>
            <p class="lastUpdated">Updated
            <span class=lastUpdated>
                16 January 2026
            </span>
        </p>
        </div>
        
        <div id="controls">
            <div id="selections">

                <label for="show">Show</label>
                <select id="show" oninput="inputsChanged()">
                    <option>all entries</option>
                    <option>untranslatables</option>
                    <option>entries where</option>
                </select>
                
                <select id="searchField">
                    <option>one translation</option>
                    <option>full definition</option>
                    <option>romanisation</option>
                    <option>pronunciation</option>
                    <option>part of speech</option>
                </select>

                <select id="searchHandling">
                    <option>contains</option>
                    <option>is exactly</option>
                    <option>begins with</option>
                    <option>ends with</option>
                </select>
            </div>

            <div id="searchBar">
                <input id="searchTerm" type="text">
                <button id="searchButton" onclick="doSearch()">Search</button>
            </div>

            <div id="searchCountLine">
                <p>Results: <span id="searchCount">0</span></p>
            </div>

            <div id="errorMessage" style="display: none">
                <p>Dictionary not found. Try visiting
                    <a href="https://docs.google.com/spreadsheets/d/1rhIVwV0jYY9r2NUKl_DB_wLGVuqgEm2qoLoqcqH1SUc/edit?usp=sharing">
                        the spreadsheet</a> directly.</p>
            </div>
        </div>

        <div id="results">
            <template id="resultEntryTemplate">
                <div class="dictionaryEntry">
                    <h2 class="romanisation"></h2>
                    <p class="pronunciation"></p>
                    <p class="partOfSpeech"></p>
                    <p class="fullDefinition"></p>
                </div>
            </template>
        </div>

        <footer>
            <p>
                This fanwork is not affiliated with Outer Wilds, Mobius Digital, or Annapurna Interactive.
            </p>
            <p>
                2026 kvkontin
            </p>
        </footer>

        <script>

            const resultsContainer = document.querySelector("#results");
            const template = document.querySelector("#resultEntryTemplate");
            const searchCount = document.querySelector("#searchCount");
            const showSelect = document.querySelector("#show");
            const searchField = document.querySelector("#searchField");
            const searchHandling = document.querySelector("#searchHandling");
            const searchTerm = document.querySelector("#searchTerm");
            const searchButton = document.querySelector("#searchButton");
            const searchControlsGroup = [searchField, searchHandling, searchTerm, searchButton];
            const errorMessage = document.querySelector("#errorMessage");
            const lightDarkButton = document.querySelector("#lightDarkButton");
            let darkMode = false;

            const lexiconLocation = "../assets/nomai/lexicon.tsv";
            let lexicon = [];

            init();


            function init() {
                setDarkModePreference();
                getLexicon().then((newLexicon) => {
                lexicon = newLexicon;
                lexicon.sort((a, b) => a["romanisation"].localeCompare(b["romanisation"].toLowerCase(),
                    "en", {sensitivity: "accent"}));
                inputsChanged();
                }).catch((reason) => {
                    errorMessage.style.display = "block";
                });
            }

            
            function getLexicon() {
                let lexicon = fetch(lexiconLocation).then((response) => {
                    if(!response.ok) {
                        throw new Error(`Cannot fetch lexicon file, response status ${response.statusText}`);
                    }
                    else {
                        return response.text();
                    }
                }).then((text) => {
                    let lexiconBeingBuilt = [];

                    let splitsByLine = text.split('\n');
                    let tableContent = splitsByLine.slice(1); // Omit header line from data

                    for (line of tableContent) {
                        let lineSplits = line.split('\t');

                        let newEntry = {
                            "include": lineSplits[0] == "TRUE",
                            "partOfSpeech": lineSplits[1],
                            "pronunciation": lineSplits[2],
                            "romanisation": lineSplits[3],
                            "definition": lineSplits[4],
                            "keywords": lineSplits[5].split(',').map((string) => string.trim())
                        };

                        lexiconBeingBuilt.push(newEntry);
                    }
                    return lexiconBeingBuilt;
                });
                return lexicon;
            }


            function setDarkModePreference () {
                darkMode = false;
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    darkMode = true;
                }
            }

            function inputsChanged() {
                updateControlsVisibility();
                doSearch();
            }


            function updateControlsVisibility() {
                visibilityValue = ["all entries", "untranslatables"].includes(showSelect.value) ? "none" : "initial";
                for (element of searchControlsGroup) {
                    element.style.display = visibilityValue;
                }
            }


            function doSearch() {

                if(!lexicon) {return;}

                const showMode = showSelect.value;
                const field = searchField.value;
                const term = searchTerm.value;
                const handling = searchHandling.value;

                const fieldNameMap = {
                    "one translation": "keywords",
                    "full definition": "definition",
                    "romanisation": "romanisation",
                    "pronunciation": "pronunciation",
                    "part of speech": "partOfSpeech"
                };

                const relevantFieldName = fieldNameMap[field];
                let results = [];

                const startMark = (handling == "is exactly" || handling == "begins with") ? "^" : "";
                const endMark = (handling == "is exactly" || handling == "ends with") ? "$" : "";
                const regex = new RegExp(`${startMark}${term}${endMark}`, "ig"); // ignore case, global search

                for (lexiconEntry of lexicon) {

                    if(!lexiconEntry["include"] || lexiconEntry["romanisation"].length == 0) {
                        continue;
                    }
                    if(showMode == "all entries") {
                        results.push(lexiconEntry);
                        continue;
                    }
                    if(showMode == "untranslatables" && lexiconEntry["keywords"].includes("untranslatable")) {
                        results.push(lexiconEntry);
                        continue;
                    }
                    if(showMode == "entries where") {
                        if(field == "one translation") {
                            if(lexiconEntry["keywords"].some((value) => value.match(regex))) {
                                results.push(lexiconEntry);
                                continue;
                            }
                        }
                        else if(lexiconEntry[relevantFieldName].match(regex)) {
                            results.push(lexiconEntry);
                            continue;
                        }
                    }
                }

                resultsContainer.replaceChildren();

                for (result of results) {
                    const clone = document.importNode(template.content, true);
                    clone.querySelector(".romanisation").textContent = result["romanisation"];
                    clone.querySelector(".pronunciation").textContent = `/${result["pronunciation"]}/`;
                    clone.querySelector(".partOfSpeech").textContent = result["partOfSpeech"];
                    clone.querySelector(".fullDefinition").textContent = result["definition"];
                    resultsContainer.appendChild(clone);
                }
                searchCount.textContent = results.length;
            }

            function darkModeToggled() {
                darkMode = !darkMode;
                const suffixString = darkMode? "dark" : "light";
                lightDarkButton.textContent = `Mode: ${suffixString}`;
                const root = document.querySelector(":root");
                root.style.setProperty("--background",          `var(--background-${suffixString})`);
                root.style.setProperty("--content",             `var(--content-${suffixString})`);
                root.style.setProperty("--highlight-blue",      `var(--highlight-blue-${suffixString})`);
                root.style.setProperty("--highlight-orange",    `var(--highlight-orange-${suffixString})`);
            }
        </script>

    </body>
</html>
