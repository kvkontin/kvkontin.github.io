<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Nomai Language Dictionary</title>
        <link rel="icon" type="image/x-icon" href="../assets/nomai/nomai_icon.ico">
        <link rel="stylesheet" href="../assets/nomai/nomai_default_style.css">
        <meta charset="UTF-8">
        <meta name="description" content="Search the dictionary of the fanmade Nomai language.">
        <meta name="author" content="kvkontin">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>
            #headingContainer {
                padding: 14px;
            }
            .lastUpdated {
                color: var(--highlight-orange);
            }
            #controls {
                position: sticky;
                top: 0px;
                left: 0px;
                margin: 0px;
                padding-left: 14px;
                padding-top: 4px;
                padding-bottom: 8px;
            }
            #selections, #searchBar, #accentHandlingInner {
                display: inline-block;
            }
            input, button, select {
                border-color: var(--content);
                border-style: solid;
                border-width: 2px;
                border-radius: 6px;
                padding: 4px;
                margin-top: 4px;
                margin-bottom: 4px;
            }
            #results {
                margin: auto;
                max-width: 600px;
                padding-left: 14px;
                padding-right: 14px;
            }
            .dictionaryEntry {
                padding-bottom: 10px;
            }
            .romanisation {
                font-family: 'Courier New', monospace;
                font-size: 20px;
                font-weight: bold;
                color: var(--highlight-blue);
                margin-bottom: 0px;
                padding-bottom: 0px;
            }
            .pronunciation {
                font-size: 14px;
                color: var(--content);
                margin-top: 0px;
                padding-top: 0px;
                margin-bottom: 4px;
                padding-bottom: 0px;
            }
            .partOfSpeech {
                font-size: 12px;
                color: var(--highlight-orange);
                margin-top: 0px;
                padding-top: 0px;
            }
            footer {
                margin-top: 48px;
            }
            footer > * {
                color: var(--content);
                opacity: 0.7;
                font-size: 12px;
            }
            .hidden {
                visibility: hidden;
            }
        </style>
    </head>

    <body>
        <a href="/nomai/home.html">&lt; back to Nomai home</a>
        <button id="lightDarkButton" onclick="darkModeToggled()">Mode: dark</button>

        <div id="headingContainer">
            <h1>Nomai Language Dictionary</h1>
            <p id="lastUpdatedContainer" class="lastUpdated">Updated
            <span id="lastUpdated" class=lastUpdated>
                at unknown time
            </span>
        </p>
        </div>
        
        <form id="controls" name="controls" method="get" target="_self">
            <div id="selections">

                <label for="show">Show</label>
                <select id="show" name="show" oninput="inputsChanged()">
                    <option value="all">all entries</option>
                    <option value="untrans">untranslatables</option>
                    <option value="where">entries where</option>
                </select>
                
                <select id="searchField" name="field">
                    <option value="trans">one translation</option>
                    <option value="def">full definition</option>
                    <option value="word">spelling</option>
                    <option value="ipa">pronunciation</option>
                    <option value="pos">part of speech</option>
                </select>

                <select id="searchHandling" name="op">
                    <option value="has">contains</option>
                    <option value="is">is exactly</option>
                    <option value="begin">begins with</option>
                    <option value="end">ends with</option>
                </select>

                <div id="accentHandling">
                    <div id="accentHandlingInner">
                        <input id="exactAccents" type="checkbox" name="accents" value="exact" checked>
                        <label for="exactAccents">Match accent marks</label>
                    </div>
                </div>
            </div>

            <div id="searchBar">
                <input id="searchTerm" type="search" name="q">
                <button id="searchButton"type="submit">Search</button>
            </div>

            <div id="searchCountLine">
                <p>Results: <span id="searchCount">0</span></p>
            </div>

            <div id="errorMessage" style="display: none">
                <p>Dictionary not found. Try visiting
                    <a href="https://docs.google.com/spreadsheets/d/1rhIVwV0jYY9r2NUKl_DB_wLGVuqgEm2qoLoqcqH1SUc/edit?usp=sharing">
                        the spreadsheet</a> directly.</p>
            </div>
        </form>

        <div id="results">
            <template id="resultEntryTemplate">
                <div class="dictionaryEntry">
                    <h2 class="romanisation"></h2>
                    <p class="pronunciation"></p>
                    <p class="partOfSpeech"></p>
                    <p class="fullDefinition"></p>
                </div>
            </template>
        </div>

        <footer>
            <p>
                This fanwork is not affiliated with Outer Wilds, Mobius Digital, or Annapurna Interactive.
            </p>
            <p>
                2026 kvkontin
            </p>
        </footer>

        <script>

            let doneLoading = false;
            let darkMode = false;

            const lastUpdated = document.querySelector("#lastUpdated");
            const controlsForm = document.querySelector("#controls");
            const resultsContainer = document.querySelector("#results");
            const template = document.querySelector("#resultEntryTemplate");
            const searchCount = document.querySelector("#searchCount");
            const showSelect = document.querySelector("#show");
            const searchField = document.querySelector("#searchField");
            const searchHandling = document.querySelector("#searchHandling");
            const accentHandling = document.querySelector("#accentHandling");
            const accentHandlingInner = document.querySelector("#accentHandlingInner");
            const exactAccentsCheckbox = document.querySelector("#exactAccents")
            const searchTerm = document.querySelector("#searchTerm");
            const searchButton = document.querySelector("#searchButton");
            const searchControlsGroup = [searchField, searchHandling, accentHandling, accentHandlingInner, searchTerm, searchButton];
            const errorMessage = document.querySelector("#errorMessage");
            const lightDarkButton = document.querySelector("#lightDarkButton");

            const lexiconLocation = "../assets/nomai/lexicon.tsv";
            let lexicon = [];

            init();


            function init() {
                const params = validateParams(paramsToObject(new URLSearchParams(location.search)));
                setFormState(params);
                setDarkModePreference();
                getLexicon().then((newLexicon) => {
                    lexicon = newLexicon;
                }).catch((reason) => {
                    console.error(reason);
                    errorMessage.style.display = "block";
                }).then(() => {
                    inputsChanged();
                    searchByParams(params);
                    doneLoading = true;
                });
            }


            function paramsToObject(rawParams) {
                const object = {};
                for (const [key, value] of rawParams) {
                    object[key] = value;
                }
                return object;
            }


            function validateParams(params) {
                // return a new object with required parameters defaulted
                const newParams = {...params};
                
                newParams.q = params.q || "";

                if (!newParams.field || !['trans', 'def', 'word', 'ipa', 'pos'].includes(newParams.field)) {
                    newParams.field = 'word';
                }

                if (!newParams.show || !['all', 'untrans', 'where', 'ipa', 'pos'].includes(newParams.show)) {
                    newParams.show = 'all';
                }

                if (!newParams.op || !['is', 'has', 'begin', 'end'].includes(newParams.op)) {
                    newParams.op = 'is';
                }

                return newParams;
            }


            function setFormState(params) {
                exactAccentsCheckbox.checked = false;
                if(params["accents"]) {
                    exactAccentsCheckbox.checked = true;
                }
                for (const key in params) {
                    const relevantElement = controlsForm.elements[key];
                    if (relevantElement == undefined) {
                        continue;
                    }
                    relevantElement.value = params[key];
                }
            }

            function setLastUpdated(timeString) {
                // Assume HTTP date format like "Fri, 15 May 2026 22:28:44 GMT"
                const splits = timeString.split(" ");
                const compactTime = `${splits[1]} ${splits[2]} ${splits[3]}`
                lastUpdated.textContent = compactTime;
            }

            
            function getLexicon() {
                return fetch(lexiconLocation).then((response) => {
                    if(!response.ok) {
                        throw new Error(`Cannot fetch lexicon file, response status ${response.statusText}`);
                    }

                    setLastUpdated(response.headers.get("last-modified"));
                    return response.text().then((text) => {
                        let lexicon = [];
                        const splitsByLine = text.split('\n');
                        const tableContent = splitsByLine.slice(1); // Omit header line from data

                        for (line of tableContent) {
                            let lineSplits = line.split('\t');

                            let newEntry = {
                                "include": lineSplits[0] == "TRUE",
                                "partOfSpeech": lineSplits[1],
                                "pronunciation": lineSplits[2],
                                "romanisation": lineSplits[3],
                                "definition": lineSplits[4],
                                // If keywords is empty string, splitting would return 1-element array; prevent this
                                "keywords": lineSplits[5] == "" ? [] : lineSplits[5].split(',').map((string) => string.trim())
                            };

                            lexicon.push(newEntry);
                        }
                        lexicon.sort((a, b) => a["romanisation"].localeCompare(b["romanisation"].toLowerCase(),
                            "en", {sensitivity: "accent"}));
                        return lexicon;
                    });
                });
            }


            function setDarkModePreference () {
                darkMode = false;
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    darkMode = true;
                }
            }


            function darkModeToggled() {
                darkMode = !darkMode;
                const suffixString = darkMode? "dark" : "light";
                lightDarkButton.textContent = `Mode: ${suffixString}`;
                const root = document.querySelector(":root");
                root.style.setProperty("--background",          `var(--background-${suffixString})`);
                root.style.setProperty("--content",             `var(--content-${suffixString})`);
                root.style.setProperty("--highlight-blue",      `var(--highlight-blue-${suffixString})`);
                root.style.setProperty("--highlight-orange",    `var(--highlight-orange-${suffixString})`);
            }


            function inputsChanged() {
                updateControlsVisibility();
                if (doneLoading) {controlsForm.requestSubmit();}
            }


            function updateControlsVisibility() {
                let noControls = ["all", "untrans"].includes(showSelect.value);
                let visibilityValue = noControls ? "none" : "initial";
                for (element of searchControlsGroup) {
                    element.style.display = visibilityValue;
                    element.disabled = noControls;
                }
            }


            function stripAccentMarks(string) {
                let output = string;
                const mapping = [
                    ['á', 'a'],
                    ['é', 'e'],
                    ['ó', 'o'],
                    ['ý', 'y'],
                ];
                for (entry of mapping) {
                    output = output.replaceAll(entry[0], entry[1]);
                }
                return output;
            }


            function searchByParams(params) {
                if(!lexicon) {return;}

                params = validateParams(params);
                let term = params.q.toLowerCase();

                const fieldNameMap = {
                    "trans": "keywords",
                    "def": "definition",
                    "word": "romanisation",
                    "ipa": "pronunciation",
                    "pos": "partOfSpeech"
                };

                const relevantFieldName = fieldNameMap[params.field];
                let results = [];

                const startMark = (params.op == "is" || params.op == "begin") ? "^" : "";
                const endMark = (params.op == "is" || params.op == "ends") ? "$" : "";
                if(params.accents != "exact") {
                    term = stripAccentMarks(term);
                }
                const regex = new RegExp(`${startMark}${RegExp.escape(term)}${endMark}`, "ig"); // ignore case, global search

                for (lexiconEntry of lexicon) {

                    if(!lexiconEntry["include"] || lexiconEntry["romanisation"].length == 0) {
                        continue;
                    }
                    if(params.show == "all" && lexiconEntry["keywords"].length != 0) {
                        results.push(lexiconEntry);
                        continue;
                    }
                    if(params.show == "untrans" && lexiconEntry["keywords"].includes("untranslatable")) {
                        results.push(lexiconEntry);
                        continue;
                    }
                    if(params.show == "where") {
                        if(params.field == "trans") {
                            if(lexiconEntry["keywords"].some((value) => value.match(regex))) {
                                results.push(lexiconEntry);
                                continue;
                            }
                        }
                        else {
                            if(params.accents != "exact" && stripAccentMarks(lexiconEntry[relevantFieldName]).match(regex)
                            || lexiconEntry[relevantFieldName].match(regex)) {
                                results.push(lexiconEntry);
                                continue;
                            }
                        }
                    }
                }

                resultsContainer.replaceChildren();

                for (result of results) {
                    const clone = document.importNode(template.content, true);
                    clone.querySelector(".romanisation").textContent = result["romanisation"];
                    clone.querySelector(".pronunciation").textContent = `/${result["pronunciation"]}/`;
                    clone.querySelector(".partOfSpeech").textContent = result["partOfSpeech"];
                    clone.querySelector(".fullDefinition").textContent = result["definition"];
                    resultsContainer.appendChild(clone);
                }
                searchCount.textContent = results.length;
            }
            
        </script>

    </body>
</html>
